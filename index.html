<meta charset="UTF-8">
<title>天氣資訊</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+HK:wght@800&display=swap" rel="stylesheet">
<link rel="icon" href="https://timl-ec.github.io/weather/favicon.ico" type="image/x-icon">
<link rel="apple-touch-icon" sizes="180x180" href="https://timl-ec.github.io/weather/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="https://timl-ec.github.io/weather/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="https://timl-ec.github.io/weather/favicon-16x16.png">

<style>
    body {
        font-family: sans-serif;
        margin: 0;
        padding: 0;
        background-color: #f0f0f0;
        height: 100vh;
        width: 100vw;
        overflow: hidden;
    }
    #background-image {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        z-index: -1;
    }
    .main-container {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        grid-template-rows: 1fr auto;
        height: 100vh;
        width: 100vw;
        padding: 120px 20px 20px 20px;
        box-sizing: border-box;
        gap: 20px;
        position: relative;
        z-index: 1;
    }
    @media (max-width: 1024px) {
        .main-container {
            grid-template-columns: 1fr 1fr;
            padding: 110px 10px 10px 10px;
            gap: 10px;
        }
    }
    .top-left {
        grid-column: span 1;
        display: flex;
        flex-direction: column;
        justify-content: flex-start;
        align-items: flex-start;
        overflow: hidden;
    }
    .top-right {
        grid-column: span 3;
        display: flex;
        justify-content: flex-end;
        align-items: flex-start;
        overflow: hidden;
    }
    .bottom-left {
        grid-column: span 2;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        align-items: center;
        text-align: center;
    }
    .bottom-right {
        grid-column: span 2;
        display: flex;
        justify-content: flex-end;
        align-items: flex-end;
    }
    @media (max-width: 1024px) {
        .top-left, .top-right, .bottom-left, .bottom-right {
            grid-column: span 1;
        }
    }
    #url-input-container {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background-color: white;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 0 20px rgba(0,0,0,0.3);
        display: none;
        z-index: 1000;
        width: 90%;
        max-width: 900px;
        max-height: 85vh;
        overflow-y: auto;
    }
    #toggle-url-input {
        background: rgba(255, 255, 255, 0.7);
        border: 1px solid #ccc;
        border-radius: 50%;
        font-size: 24px;
        cursor: pointer;
        position: fixed;
        top: 60px;
        left: 20px;
        z-index: 1001;
        width: 40px;
        height: 40px;
        display: flex;
        justify-content: center;
        align-items: center;
        box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }
    #url-input, #update-interval, #background-url, #warning-url, #heatstress-url {
        width: 100%;
        margin-bottom: 10px;
        box-sizing: border-box;
    }
    #location-select {
        width: 100%;
        margin-bottom: 10px;
    }
    #apply-changes {
        width: 100%;
    }
    #display-area {
        font-family: 'Noto Sans HK', sans-serif;
        font-weight: 800;
        font-size: clamp(30px, 5vw, 60px);
        line-height: 1.2;
        margin-bottom: 10px;
    }
    .outline-text {
        color: #000000;
        text-shadow: 
            -1px -1px 0 #FFFFFF,  
             1px -1px 0 #FFFFFF,
            -1px  1px 0 #FFFFFF,
             1px  1px 0 #FFFFFF;
    }
    #update-time {
        font-size: clamp(16px, 2vw, 25px);
        color: #FFFFFF;
        text-shadow: 
            -1px -1px 0 #000000,  
             1px -1px 0 #000000,
            -1px  1px 0 #000000,
             1px  1px 0 #000000;
    }
    #warnings, #heatstress {
        font-size: clamp(16px, 2vw, 24px);
        margin-top: 10px;
        color: white;
        text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
    }
    #weather-icon {
        margin-top: 10px;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px;
    }
    .icon-separator {

        vertical-align: middle;
    }

        border-radius: 18px;
        padding: 5px;
        vertical-align: middle;
    }
    .weather-icon-container img {

        height: auto;
    }
    #warning-icons-area {
        width: 100%;

        align-content: flex-start;

        object-fit: contain;
        flex-shrink: 1;
        flex-grow: 0;
    }
    .warning-options {
        display: flex;
        justify-content: space-between;
        flex-wrap: wrap;
    }
    #url-input-container p {
        font-size: clamp(14px, 2.5vw, 18px);
    }
    .warning-column, .weather-display-options {
        width: 30%;
        min-width: 250px;
    }
    .warning-checkbox, .weather-checkbox {
        display: flex;
        align-items: center;

    }
    .warning-checkbox input, .weather-checkbox input {

    }
    #copyright-notice a {
        color: #FCD649;
        text-decoration: none;
    }
    #copyright-notice a:hover {
        text-decoration: underline;
    }
    #uvindex {
        font-size: clamp(20px, 3vw, 35px);
        line-height: 1.2;
    }
    #thunderstorm-warning {
        font-size: clamp(16px, 2vw, 25px);
        color: red;

        padding: 5px;
        margin-bottom: 5px;
        display: none;
    }

            -1px  1px 0 #FFFFFF,

    }
    #version-info {

        margin-bottom: 10px;
    }
    #version-info a {
        color: black;
        text-decoration: none;
    }

        left: 0;
        width: 100vw;
        height: 100vh;
        background: rgba(0, 0, 0, 0.5);
        display: none;
        z-index: 999;

function toggleUrlInput() {
    const container = document.getElementById('url-input-container');
    const overlay = document.getElementById('url-input-overlay');
    const isVisible = container.style.display === 'block';
    
    if (isVisible) {
        container.style.display = 'none';
        overlay.style.display = 'none';
    } else {
        container.style.display = 'block';
        overlay.style.display = 'block';
    }
}

document.getElementById('toggle-url-input').addEventListener('click', toggleUrlInput);
document.getElementById('url-input-overlay').addEventListener('click', toggleUrlInput);

document.getElementById('apply-changes').addEventListener('click', function() {
    selectedLocation = document.getElementById('location-select').value;
    weatherUrl = document.getElementById('url-input').value;
    backgroundUrl = document.getElementById('background-url').value;
    warningUrl = document.getElementById('warning-url').value;
    heatstressUrl = document.getElementById('heatstress-url').value;
    updateInterval = document.getElementById('update-interval').value * 1000;
    
    // Update enabled warnings
    for (let key in enabledWarnings) {
        enabledWarnings[key] = document.getElementById(key).checked;
    }

    // Update display options
    displayOptions.location = document.getElementById('show-location').checked;
    displayOptions.temperature = document.getElementById('show-temperature').checked;
    displayOptions.humidity = document.getElementById('show-humidity').checked;
    displayOptions.uvindex = document.getElementById('show-uvindex').checked;
    // displayOptions.windSpeed = document.getElementById('show-wind-speed').checked;
    // displayOptions.windDirection = document.getElementById('show-wind-direction').checked;
    displayOptions.weatherIcon = document.getElementById('show-weather-icon').checked;
    displayOptions.thunderstorm = document.getElementById('show-thunderstorm').checked;

    fetchThunderstormWarning();
    updateBackgroundImage();
    fetchWeatherData();
    // fetchWindData();
    
    // Hide popup and overlay
    document.getElementById('url-input-container').style.display = 'none';
    document.getElementById('url-input-overlay').style.display = 'none';
});

function updateBackgroundImage() {
    const backgroundImage = document.getElementById('background-image');
    backgroundImage.src = backgroundUrl + '?' + new Date().getTime();
}

let currentWarningIcons = [];

function updateWarningIcons(warningIcons) {
    currentWarningIcons = warningIcons;
    const warningIconsArea = document.getElementById('warning-icons-area');
    warningIconsArea.innerHTML = '';

    const iconCount = warningIcons.length;
    if (iconCount === 0) return;

    // Get container dimensions
    const containerWidth = warningIconsArea.clientWidth || window.innerWidth * 0.7;
    const containerHeight = warningIconsArea.clientHeight || window.innerHeight * 0.7;

    let iconSize;
    if (iconCount === 1) {
        iconSize = Math.min(containerWidth * 0.9, containerHeight * 0.9);
    } else if (iconCount === 2) {
        // For 2 icons, try placing them side-by-side or top-bottom
        const sideBySize = Math.min(containerWidth / 2 * 0.9, containerHeight * 0.9);
        const topBottomSize = Math.min(containerWidth * 0.9, containerHeight / 2 * 0.9);
        iconSize = Math.max(sideBySize, topBottomSize);
    } else {
        // For more icons, calculate based on rows and columns
        let bestSize = 0;
        for (let cols = 1; cols <= iconCount; cols++) {
            const rows = Math.ceil(iconCount / cols);
            const size = Math.min(containerWidth / cols * 0.9, containerHeight / rows * 0.9);
            if (size > bestSize) {
                bestSize = size;
            }
        }
        iconSize = bestSize;
    }

    // Limit icon size to something reasonable but still large
    iconSize = Math.max(iconSize, 100);

    warningIcons.forEach((icon) => {
        const img = document.createElement('img');
        img.src = icon.src;
        img.alt = icon.alt;
        img.style.width = `${iconSize}px`;
        img.style.height = `${iconSize}px`;
        img.style.objectFit = 'contain';
        img.style.border = '5px solid #A8A8A8';
        img.style.boxSizing = 'border-box';
        warningIconsArea.appendChild(img);
    });
}

window.addEventListener('resize', () => {
    if (currentWarningIcons.length > 0) {
        updateWarningIcons(currentWarningIcons);
    }
});

function fetchThunderstormWarning() {
    fetch("https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=warnsum&lang=tc")
        .then(response => response.json())
        .then(data => {
            if (data.WTS && data.WTS.actionCode !== "CANCEL") {
                return fetch("https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=warningInfo&lang=tc");
            } else {
                document.getElementById('thunderstorm-warning').style.display = 'none';
                return Promise.reject("No active thunderstorm warning");
            }
        })
        .then(response => response.json())
        .then(data => {
            const warningDetails = data.details[0];
            const validTime = warningDetails.contents[0].match(/，([^，]+)，/)[1];
            document.getElementById('thunderstorm-warning').textContent = `雷暴警告 : ${validTime}`;
            document.getElementById('thunderstorm-warning').style.display = displayOptions.thunderstorm ? 'block' : 'none';
        })
        .catch(error => {
            console.log(error);
            document.getElementById('thunderstorm-warning').style.display = 'none';
        });
}

function fetchWeatherData() {
    fetch(weatherUrl)
        .then(response => response.json())
        .then(data => {
            const temperatureData = data.temperature.data.find(item => item.place === selectedLocation);
            const humidityData = data.humidity.data[0];
            const iconData = data.icon;
            const uvData = data.uvindex ? data.uvindex.data[0] : null;
            
            updateDisplayArea(temperatureData, humidityData, uvData, iconData);
            const now = new Date();
            document.getElementById('update-time').innerHTML = `資訊更新時間：${now.toLocaleString('zh-HK', { timeZone: 'Asia/Hong_Kong' })}`;
        })
        .catch(error => console.error('Error:', error));

    Promise.all([
        fetch(warningUrl).then(response => response.json()),
        fetch(heatstressUrl).then(response => response.json())
    ])
    .then(([warningData, heatstressData]) => {
        let warningIcons = [];

        for (let key in warningData) {
            if (['ISSUE', 'REISSUE', 'EXTEND', 'UPDATE'].includes(warningData[key].actionCode) && enabledWarnings[key]) {
                warningIcons.push({
                    src: `https://raw.githubusercontent.com/TIML-EC/weather/main/ICON/${warningData[key].code}.png`,
                    alt: warningData[key].name
                });
            }
        }

        if (heatstressData.hsww && heatstressData.hsww.actionCode === 'ISSUE' && enabledWarnings.HSWW) {
            const warningLevel = heatstressData.hsww.warningLevel;
            warningIcons.push({
                src: `https://raw.githubusercontent.com/TIML-EC/weather/main/ICON/${warningLevel}.png`,
                alt: `${warningLevel} Heat Stress Warning`
            });
        }

        updateWarningIcons(warningIcons);
    })
    .catch(error => console.error('Error:', error));

    fetchThunderstormWarning();
    updateBackgroundImage();
}

function updateDisplayArea(temperatureData, humidityData, uvData, iconData) {
    let displayAreaHtml = '';
    if (temperatureData && humidityData) {
        if (displayOptions.location) {
            displayAreaHtml += `<span class="outline-text">${selectedLocation}</span><br>`;
        }
        if (displayOptions.temperature) {
            displayAreaHtml += `<span class="outline-text">${temperatureData.value}°C</span><br>`;
        }
        if (displayOptions.humidity) {
            displayAreaHtml += `<span class="outline-text">${humidityData.value}%</span>`;
        }
    }
    
    if (displayOptions.uvindex && uvData) {
        displayAreaHtml += `<br><span id="uvindex" class="outline-text">紫外線指數 ${uvData.value} (${uvData.desc})</span>`;
    }
    
    document.getElementById('display-area').innerHTML = displayAreaHtml;
    
    let iconHtml = '';
    if (displayOptions.weatherIcon && iconData && iconData.length > 0) {
        iconData.forEach((icon, index) => {
            iconHtml += `<div class="weather-icon-container"><img src="https://raw.githubusercontent.com/TIML-EC/weather/main/ICON/${icon}.png" width="150" height="150" alt="Weather icon ${icon}"></div>`;
            if (index < iconData.length - 1) {
                iconHtml += '<span class="icon-separator outline-text">⇨</span>';
            }
        });
    }
    document.getElementById('weather-icon').innerHTML = iconHtml;
}

updateBackgroundImage();
fetchWeatherData();
// fetchWindData();
setInterval(fetchWeatherData, updateInterval);
// setInterval(fetchWindData, windDataUpdateInterval);
</script>
